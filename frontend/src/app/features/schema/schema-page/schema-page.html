<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3 px-3">
    <h1 class="h4 mb-0">Schéma — {{ database }}</h1>
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="backToUpload()">← Upload</button>
  </div>

  <div class="alert alert-danger mx-3" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="text-center py-5" *ngIf="isGenerating">
    <div class="spinner-border text-primary"></div>
    <p class="mt-3 text-muted">{{ mode === 'validated' ? 'Chargement du schéma validé...' : 'Génération du schéma en cours...' }}</p>
  </div>

  <div class="row px-3" *ngIf="schema && !isGenerating">
    <!-- Diagramme + description -->
    <div class="col-lg-8">

      <!-- Panneau d'états -->
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3" *ngIf="states.length > 0">
        <span class="text-muted small me-1">Historique :</span>
        <div class="btn-group" *ngFor="let s of states" role="group">
          <button
            type="button"
            class="btn btn-sm"
            [ngClass]="s.stepNumber === currentStepNumber ? 'btn-primary' : 'btn-outline-secondary'"
            (click)="revertToStep(s.stepNumber)"
            [title]="'Revenir à ' + s.label"
          >
            {{ s.label }}
            <span *ngIf="validatedStepNumber === s.stepNumber" title="Validé">✓</span>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-success"
            (click)="validateState(s)"
            [disabled]="validatingStepNumber === s.stepNumber"
            title="Valider cet état"
          >
            <span *ngIf="validatingStepNumber === s.stepNumber" class="spinner-border spinner-border-sm"></span>
            <span *ngIf="validatingStepNumber !== s.stepNumber">Valider</span>
          </button>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body p-0" style="overflow: auto; max-height: 600px;">
          <svg [attr.width]="diagramWidth" [attr.height]="diagramHeight" [attr.viewBox]="'0 0 ' + diagramWidth + ' ' + diagramHeight">
            <defs>
              <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 Z" fill="#888" />
              </marker>
            </defs>

            <line
                *ngFor="let l of diagramLines"
                [attr.x1]="l.x1" [attr.y1]="l.y1" [attr.x2]="l.x2" [attr.y2]="l.y2"
                [attr.stroke]="l.kind === 'dim-subdim' ? '#adb5bd' : '#888'"
                [attr.stroke-dasharray]="l.kind === 'dim-subdim' ? '4,3' : null"
                stroke-width="1.5"
                marker-end="url(#arrow)"
                />

            <g *ngFor="let box of diagramBoxes">
              <rect
                [attr.x]="box.x" [attr.y]="box.y" [attr.width]="box.width" [attr.height]="box.height"
                rx="6"
                [attr.fill]="box.type === 'fact' ? '#198754' : box.type === 'time' ? '#fd7e14' : box.type === 'subdimension' ? '#e9ecef' : '#0d6efd'"
                [attr.fill-opacity]="box.type === 'subdimension' ? 1 : 0.15"
                [attr.stroke]="box.type === 'fact' ? '#198754' : box.type === 'time' ? '#fd7e14' : box.type === 'subdimension' ? '#adb5bd' : '#0d6efd'"
                stroke-width="1.5"
              />
              <text [attr.x]="box.x + 8" [attr.y]="box.y + 18" font-size="12" font-weight="bold" fill="#212529">
                {{ box.label }}
              </text>
              <text
                *ngFor="let attr of box.attributes; let i = index"
                [attr.x]="box.x + 8"
                [attr.y]="box.y + 34 + i * 18"
                font-size="10"
                fill="#495057"
              >
                {{ attr }}
              </text>
            </g>
          </svg>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <p class="mb-0">{{ summaryText }}</p>
        </div>
      </div>

      <button type="button" class="btn btn-success" (click)="validateSchema()">
        ✓ Valider ce schéma définitivement
      </button>
    </div>

    <!-- Chat -->
    <div class="col-lg-4">
      <div class="card">
        <div class="card-header">Discussion avec l'IA</div>
        <div class="card-body" style="height: 400px; overflow-y: auto;">
          <div *ngFor="let msg of messages" class="mb-2" [ngClass]="msg.role === 'user' ? 'text-end' : 'text-start'">
            <span
              class="badge"
              [ngClass]="msg.role === 'user' ? 'bg-primary' : 'bg-light text-dark border'"
              style="white-space: pre-wrap; text-align: left; display: inline-block; padding: 8px;"
            >
              {{ msg.text }}
            </span>
          </div>
        </div>
        <div class="card-footer">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              placeholder="Question ou modification..."
              [(ngModel)]="userInput"
              (keyup.enter)="sendMessage()"
              [disabled]="isSending"
            />
            <button type="button" class="btn btn-primary" [disabled]="isSending || !userInput.trim()" (click)="sendMessage()">
              <span *ngIf="isSending" class="spinner-border spinner-border-sm"></span>
              <span *ngIf="!isSending">→</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
